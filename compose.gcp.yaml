# Crunchy Gherkins TCG — GCP overlay
#
# Adds Cloud SQL Auth Proxy, exposes TLS ports on the frontend, and mounts
# the Let's Encrypt nginx config.
#
# Preferred: set COMPOSE_FILE=compose.yaml:compose.gcp.yaml in .env, then:
#   docker compose up -d --build
#
# Or pass -f flags explicitly:
#   docker compose -f compose.yaml -f compose.gcp.yaml up -d --build
#   docker compose -f compose.yaml -f compose.gcp.yaml down
#   docker compose -f compose.yaml -f compose.gcp.yaml logs -f bot api

services:
  # ── Bot & API — wait for Cloud SQL proxy ──────────────────────────
  bot:
    depends_on:
      cloud-sql-proxy:
        condition: service_started

  api:
    depends_on:
      cloud-sql-proxy:
        condition: service_started

  # ── Frontend — TLS termination via Let's Encrypt ──────────────────
  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./miniapp/nginx.gcp.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  # ── Cloud SQL Auth Proxy ──────────────────────────────────────────
  # Encrypted tunnel to Cloud SQL. Requires service-account.json at repo root
  # and CLOUD_SQL_CONNECTION_NAME set in .env.
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    command:
      - ${CLOUD_SQL_CONNECTION_NAME:?CLOUD_SQL_CONNECTION_NAME must be set}
      - --address=0.0.0.0
      - --port=5432
    volumes:
      - ./service-account.json:/credentials.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /credentials.json
    restart: unless-stopped
