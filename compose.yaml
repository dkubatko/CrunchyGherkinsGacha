# Crunchy Gherkins TCG — Docker Compose (base)
#
# This is the shared base configuration. Use an environment overlay to
# bring in deployment-specific services and networking. The overlay is
# selected by setting COMPOSE_FILE in .env on the target server:
#
#   GCP:    COMPOSE_FILE=compose.yaml:compose.gcp.yaml
#   Self-hosted: COMPOSE_FILE=compose.yaml:compose.selfhosted.yaml
#
# Alternatively, pass -f flags explicitly:
#
#   GCP:    docker compose -f compose.yaml -f compose.gcp.yaml up -d --build
#   Self-hosted: docker compose -f compose.yaml -f compose.selfhosted.yaml up -d --build
#
# For local development WITHOUT Docker, run directly:
#   python bot/bot.py --debug
#   uvicorn bot.api.server:app --reload
#   cd miniapp && npm run dev

name: crunchy-gherkins-tcg

services:
  # ── Redis (ephemeral state store) ──────────────────────────────────
  # Used for short-lived, TTL-keyed data that doesn't belong in PostgreSQL
  # (e.g. handshake tokens, rate-limit counters). No persistence configured —
  # all data is treated as ephemeral and survives only as long as the process.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Telegram Bot API Server ────────────────────────────────────────
  # Local server for large file uploads (up to 2GB vs 50MB with api.telegram.org).
  # Both bot and api services connect to this instead of api.telegram.org.
  tg-bot-api:
    image: aiogram/telegram-bot-api:latest
    env_file: .env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg_api_data:/var/lib/telegram-bot-api
    restart: unless-stopped

  # ── Bot (Telegram polling) ─────────────────────────────────────────
  # Long-running process that polls Telegram for messages and handles commands.
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    command: ["python", "bot.py"]
    env_file: .env
    environment:
      TELEGRAM_BOT_API_URL: http://tg-bot-api:8081
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      tg-bot-api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - bot_data:/app/bot/data
      - tg_api_data:/var/lib/telegram-bot-api
    restart: unless-stopped

  # ── API (FastAPI + Gunicorn) ───────────────────────────────────────
  # HTTP server powering the Mini App and admin dashboard.
  # Same Docker image as bot, different entrypoint command.
  api:
    build:
      context: ./bot
      dockerfile: Dockerfile
    command:
      - gunicorn
      - api.server:app
      - --workers=5
      - --worker-class=uvicorn.workers.UvicornWorker
      - --bind=0.0.0.0:8000
      - --timeout=120
      - --keep-alive=5
      - --max-requests=1000
      - --max-requests-jitter=100
      - --preload
      - --log-level=info
      - --access-logfile=-
      - --error-logfile=-
    env_file: .env
    environment:
      TELEGRAM_BOT_API_URL: http://tg-bot-api:8081
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      tg-bot-api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - bot_data:/app/bot/data
      - tg_api_data:/var/lib/telegram-bot-api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
            "http://127.0.0.1:8000/docs",
            timeout=5
          )
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Frontend (Nginx serving built React SPA) ───────────────────────
  # Multi-stage build; Nginx reverse-proxies /api/ to the api service.
  # Port bindings and nginx config are provided by the environment overlay.
  frontend:
    build:
      context: ./miniapp
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bot_data:
  tg_api_data:
